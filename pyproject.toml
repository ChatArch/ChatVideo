[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatVideo"
dynamic = ["version"]
description = "ChatArch video tooling package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0", "chatstyle>=0.1.0,<0.2.0", "chatenv>=0.2.0,<0.3.0"]
authors = [{name = "ChatArch", email = "rex@chatarch.org"}]
keywords = ["chatvideo", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatVideo"
Repository = "https://github.com/ChatArch/ChatVideo"

[project.scripts]
chatvideo = "chatvideo.cli:main"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]

[tool.setuptools.dynamic]
version = {attr = "chatvideo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
